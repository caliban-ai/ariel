[package]
name = "ariel-daemon"
description = "arield, the long-running Ariel chat bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Startup pieces (configuration, health) live in the library so they can be
# tested without running the daemon.
[lib]
name = "ariel_daemon"
path = "src/lib.rs"

[[bin]]
name = "arield"
path = "src/main.rs"

# Features are additive, never mutually exclusive: they decide which providers
# can exist in a build. Which provider runs is configuration, not a feature.
[features]
default = ["discord"]
discord = ["dep:ariel-discord"]

[dependencies]
ariel-core.workspace = true
ariel-discord = { workspace = true, optional = true }
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The wiring test runs the bridge against a stub prosperod, channel records in
# gonzalo's filesystem store, and the console provider.
gonzalo = { workspace = true, features = ["fs"] }
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
