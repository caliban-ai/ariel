[package]
name = "ariel-core"
description = "Provider-agnostic core of the Ariel chat bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# ariel-core is always built, so it must never depend on a chat platform SDK.
# Platform code belongs in a feature-gated backend crate.
[features]
# The shared provider contract suite (ADR 0006), for backends' tests.
contract-tests = []

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
getrandom.workspace = true
# `remote` brings ServerStore, the HTTP client for gonzalod.
gonzalo = { workspace = true, features = ["remote"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Enables the contract suite for this crate's own tests, so a plain
# `cargo test --workspace` runs them.
ariel-core = { path = ".", features = ["contract-tests"] }
axum.workspace = true
# Tests use gonzalo's filesystem store in a temporary directory.
gonzalo = { workspace = true, features = ["fs"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "test-util"] }
