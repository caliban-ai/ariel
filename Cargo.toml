[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/caliban-ai/ariel"

[workspace.dependencies]
ariel-core = { path = "crates/core" }
# Chat backends. Each is `optional = true` where it is consumed, so a build
# without its feature cannot load that platform's SDK.
ariel-discord = { path = "crates/discord" }

async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.3"
# Access-control records (ADR 0003, gonzalo ADR 0022 and 0023). The fleet
# record kinds ship from 0.7.0; 0.6.0 and earlier cannot decode them.
gonzalo = { version = "0.7", default-features = false }
# Plain HTTP only for now: prosperod is unauthenticated and binds loopback by
# default. TLS arrives with the deployment decision (#5).
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "std"] }

# Discord backend (ADR 0010). twilight enables no TLS crypto provider, so
# ariel-discord pins rustls 0.23 with ring and installs it explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"
twilight-util = { version = "0.17", features = ["builder"] }
