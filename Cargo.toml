[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/caliban-ai/ariel"

[workspace.dependencies]
ariel-core = { path = "crates/core" }
# Chat backends. Each is `optional = true` where it is consumed, so a build
# without its feature cannot load that platform's SDK.
ariel-discord = { path = "crates/discord" }

async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
# Plain HTTP only for now: prosperod is unauthenticated and binds loopback by
# default. TLS arrives with the deployment decision (#5).
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
